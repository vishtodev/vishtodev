<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">Vishal R. - Quantum AI, LLMs and multimodal systems</title>
<desc id="d">Dark navy banner with violet and cyan circuit traces, a neural network motif and quantum orbital arcs.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04060F"/><stop offset=".5" stop-color="#0A0D26"/><stop offset="1" stop-color="#05122A"/></linearGradient>
  <radialGradient id="gl" cx="14%" cy="30%" r="45%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".38"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="gr" cx="88%" cy="70%" r="45%"><stop offset="0" stop-color="#06B6D4" stop-opacity=".30"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#DDD6FE"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
  <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A78BFA" stroke-opacity=".07" stroke-width="1"/></pattern>
  <style>
    .flow{stroke-dasharray:6 10;animation:flow 6s linear infinite}
    .tw{animation:tw 4s ease-in-out infinite}
    .tw2{animation:tw 5.5s ease-in-out infinite .8s}
    .orb{transform-box:fill-box;transform-origin:center;animation:orb 60s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-64}}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes orb{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.flow,.tw,.tw2,.orb{animation:none}}
  </style>
</defs>
