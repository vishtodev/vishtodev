<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d">
<title id="t">Abstract quantum-LLM emblem</title>
<desc id="d">A Bloch sphere with a state vector, orbital rings and a ring of attention-linked token nodes. No human figure.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#14123A"/><stop offset="0.7" stop-color="#080B1E"/><stop offset="1" stop-color="#04060F"/></radialGradient>
  <linearGradient id="vc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="vc2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
  <radialGradient id="sph" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".45"/><stop offset=".55" stop-color="#312E81" stop-opacity=".22"/><stop offset="1" stop-color="#0891B2" stop-opacity=".10"/></radialGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.4"/></filter>
  <style>
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 38s linear infinite}
    .spin2{transform-box:fill-box;transform-origin:center;animation:spin 56s linear infinite reverse}
    .pulse{animation:pulse 3.4s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.spin,.spin2,.pulse{animation:none}}
  </style>
</defs>
